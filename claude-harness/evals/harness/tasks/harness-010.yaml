# Harness eval task. Only the user edits this file (evals/harness/README.md).
id: harness-010
area: harness
title: "invoice withholding on ₩1,234,567: 37,030 + 3,700 = 40,730 (each truncated to 10 won); dry run leaves no ledger"
rubric: rubrics/code-change.yaml
split: train
status: draft
lock_sha256: ""
locked: true
difficulty: routine
components: [scripts/invoice.py]

input:
  files:
    - path: spec.json
      content: |
        {"client": "Acme", "currency": "KRW", "withholding": true, "issued": "2026-10-16",
         "items": [{"desc": "KO-EN", "unit": "flat", "rate": "1234567"}]}
  steps:
    - id: dry_run
      run: ${PY} -I ${ROOT}/scripts/invoice.py make spec.json --dry-run

criteria:
  - {id: checks_pass, dimension: correctness, weight: 0.9, description: "Every expected check passes (scored 0/1)."}
  - {id: runtime, dimension: time, weight: 0.1, description: "Wall-clock ms of the steps; lower is better."}

expected_checks:
  - {id: exit_ok, kind: exit_code, value: 0}
  - {id: gross, kind: stdout_contains, values: ["₩1,234,567"]}
  - {id: income_tax, kind: stdout_contains, values: ["소득세 3%: ₩37,030"]}
  - {id: local_tax, kind: stdout_contains, values: ["지방소득세 0.3%: ₩3,700"]}
  - {id: withheld_total, kind: stdout_contains, values: ["₩40,730"]}
  - {id: net, kind: stdout_contains, values: ["Net payable: ₩1,193,837"]}
  - {id: not_rounded_up, kind: stdout_not_contains, values: ["₩40,740", "₩37,040"]}
  - {id: ledger_untouched, kind: file_absent, path: data/finance/ledger.csv}

human_scores: {}
