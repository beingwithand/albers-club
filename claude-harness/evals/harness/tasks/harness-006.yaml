# Harness eval task. Only the user edits this file (evals/harness/README.md).
id: harness-006
area: harness
title: "style_pairs nearest ranks by register first, then Korean bigram similarity over recency"
rubric: rubrics/code-change.yaml
split: train
status: draft
lock_sha256: ""
locked: true
difficulty: routine
components: [scripts/style_pairs.py, schema/ontology.yaml]

input:
  files:
    # sp_b shares the most Hangul bigrams with the query but is the OLDEST pair, so recency alone would lose it.
    # sp_c is the newest but has the wrong register.
    - path: data/style/pairs.jsonl
      content: |
        {"id": "sp_20260901_100000_bbbb", "ts": "2026-09-01T10:00:00+00:00", "draft": "계약서 검토 결과를 보내드립니다.", "final": "계약서 검토 결과를 송부드립니다.", "language": "ko", "direction": "none", "register": "formal-email", "domain": "business", "audience": "client", "edited": true}
        {"id": "sp_20261001_100000_aaaa", "ts": "2026-10-01T10:00:00+00:00", "draft": "회의 일정을 변경하고 싶습니다.", "final": "회의 일정 변경을 요청드립니다.", "language": "ko", "direction": "none", "register": "formal-email", "domain": "business", "audience": "client", "edited": true}
        {"id": "sp_20261010_100000_cccc", "ts": "2026-10-10T10:00:00+00:00", "draft": "계약서 검토 결과 봤어?", "final": "계약서 검토 결과 봤어요?", "language": "ko", "direction": "none", "register": "chat", "domain": "business", "audience": "friend", "edited": true}
  steps:
    - id: nearest
      run: ${PY} -I ${ROOT}/scripts/style_pairs.py nearest --register formal-email --text "계약서 검토 결과 회신 부탁드립니다" -k 2

criteria:
  - {id: checks_pass, dimension: correctness, weight: 0.9, description: "Every expected check passes (scored 0/1)."}
  - {id: runtime, dimension: time, weight: 0.1, description: "Wall-clock ms of the steps; lower is better."}

expected_checks:
  - {id: exit_ok, kind: exit_code, value: 0}
  - {id: top_k_two, kind: json, format: jsonl, path: "", len_equals: 2}
  - {id: bigram_match_first, kind: json, format: jsonl, path: "[0].id", equals: sp_20260901_100000_bbbb}
  - {id: other_formal_second, kind: json, format: jsonl, path: "[1].id", equals: sp_20261001_100000_aaaa}
  - {id: wrong_register_excluded, kind: json, format: jsonl, path: "", none_match: {register: chat}}

human_scores: {}
